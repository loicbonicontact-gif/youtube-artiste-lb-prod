name: Collecte horaire YouTube

on:
  schedule:
    # toutes les heures, à chaque heure pile
    - cron: "0 * * * *"
  workflow_dispatch: {}
    # workflow_dispatch permet aussi de lancer le workflow manuellement depuis GitHub

permissions:
  contents: read
  id-token: write
  # id-token: write est nécessaire pour l'authentification Google Cloud
  # sans clé JSON (Workload Identity Federation)

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Authentification Google Cloud (sans clé JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035418831203/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-youtube-artiste@api-au-tableau-de-bord.iam.gserviceaccount.com

      - name: Lancer la collecte
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 collecte_youtube.py

      - name: Sauvegarder les logs comme preuve d'exécution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-collecte
          path: logs/collecte.log
